<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#236447">
<title>تواصل وشكر وملاحظات</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:"Noto Sans Arabic",Tahoma,sans-serif;color:#173b2b;background:radial-gradient(circle at 8% 8%,#d9bb7540,transparent 27%),radial-gradient(circle at 92% 92%,#62a97838,transparent 30%),#f4f7f0;padding:18px}.page{max-width:760px;margin:24px auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#236447,#174936);color:#fff;font-size:24px}.brand div{display:flex;flex-direction:column}.brand small{color:#65766c}.back{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 14px;border-radius:13px;background:#e5f2df;color:#236447;text-decoration:none;font-weight:700}.card{overflow:hidden;border-radius:30px;background:#fff;box-shadow:0 22px 55px #173b2b1a}.hero{padding:30px;background:linear-gradient(145deg,#123f31,#236b4c 58%,#4b8d5e);color:#fff;text-align:center}.hero .icon{font-size:48px}.hero h1{margin:6px 0;font-size:clamp(28px,5vw,40px)}.hero p{margin:0;color:#e3f1e8;line-height:1.8}.form{display:grid;gap:15px;padding:28px}.form label{display:flex;flex-direction:column;gap:7px;font-weight:700}.form input,.form select,.form textarea{width:100%;border:2px solid #d9e2dc;border-radius:15px;background:#fff;color:#173b2b;padding:12px 14px;font:inherit}.form input,.form select{min-height:50px}.form textarea{min-height:150px;resize:vertical;line-height:1.7}.form input:focus,.form select:focus,.form textarea:focus{outline:0;border-color:#4b8d5e;box-shadow:0 0 0 4px #4b8d5e18}.hint{color:#65766c;font-size:13px;font-weight:400}.send{border:0;border-radius:15px;min-height:52px;background:linear-gradient(135deg,#236447,#2d7d58);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer}.send:disabled{opacity:.55;cursor:wait}.status{min-height:28px;text-align:center;font-weight:700}.status.ok{color:#247647}.status.error{color:#a53e35}.credit{text-align:center;color:#65766c;font-size:13px;margin-top:16px}.trap{position:absolute!important;right:-9999px!important;width:1px!important;height:1px!important;opacity:0!important}@media(max-width:560px){body{padding:10px}.page{margin:8px auto}.head{align-items:flex-start}.card{border-radius:23px}.hero,.form{padding:22px 16px}}
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="brand"><span class="logo" aria-hidden="true">💬</span><div><small>علوم خامس ابتدائي</small><strong>تصنيف المخلوقات الحية</strong></div></div>
    <a class="back" href="index.html">العودة للعبة</a>
  </header>
  <section class="card">
    <div class="hero"><div class="icon" aria-hidden="true">✉️</div><h1>تواصل وشكر وملاحظات</h1><p>يسعدني استقبال رسالتك واقتراحك لتطوير النشاط.</p></div>
    <form class="form" id="feedback-form">
      <label>نوع الرسالة
        <select id="message-type" required>
          <option value="شكر">شكر</option>
          <option value="ملاحظة">ملاحظة</option>
          <option value="اقتراح">اقتراح</option>
          <option value="تواصل">تواصل</option>
        </select>
      </label>
      <label>الاسم <span class="hint">اختياري</span>
        <input id="sender-name" maxlength="100" placeholder="يمكنك تركه فارغًا">
      </label>
      <label>الرسالة
        <textarea id="message" maxlength="1500" required placeholder="اكتب رسالتك هنا..."></textarea>
      </label>
      <input class="trap" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="send" id="send" type="submit">إرسال الرسالة</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
  </section>
  <p class="credit">إعداد الأستاذ علوي العباس — مدرسة جرير الابتدائية بالقطيف</p>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzdJg0JwyL1JI8vb1ISi5uCSRQ-XfjEuOJ8O478WnCf1g6CI7sXz8uEtbKIcIHikYplFg/exec';
const form=document.querySelector('#feedback-form'),send=document.querySelector('#send'),statusBox=document.querySelector('#status');
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(document.querySelector('#website').value)return;
  const message=document.querySelector('#message').value.trim();
  if(!message){statusBox.className='status error';statusBox.textContent='اكتب الرسالة أولًا.';return}
  send.disabled=true;statusBox.className='status';statusBox.textContent='جارٍ إرسال الرسالة...';
  try{
    await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'feedback',type:document.querySelector('#message-type').value,name:document.querySelector('#sender-name').value.trim(),message})});
    form.reset();statusBox.className='status ok';statusBox.textContent='✓ شكرًا لك، تم إرسال رسالتك.';
  }catch(error){statusBox.className='status error';statusBox.textContent='تعذر الإرسال الآن. تحقق من الإنترنت وحاول مرة أخرى.'}
  finally{send.disabled=false}
});
</script>
</body>
</html>
