<script>
(()=>{
  const root=document.getElementById('classification-preview');
  const main=root.querySelector('#cp-main');
  const scoreEl=root.querySelector('#cp-score');
  const starsEl=root.querySelector('#cp-stars');
  const progressEl=root.querySelector('#cp-progress');
  const studentEl=root.querySelector('#cp-student');
  const API_URL='https://script.google.com/macros/s/AKfycbzdJg0JwyL1JI8vb1ISi5uCSRQ-XfjEuOJ8O478WnCf1g6CI7sXz8uEtbKIcIHikYplFg/exec';
  function iconSvg(type){
    const icons={
      taxonomy:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 10v13M13 45V32h38v13M13 32V23h38v9"/><circle cx="32" cy="9" r="6"/><circle cx="13" cy="50" r="6"/><circle cx="32" cy="50" r="6"/><circle cx="51" cy="50" r="6"/></svg>',
      life:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 42c-8-3-9-14-2-18 5-3 10 1 11 6 2-8 12-10 17-4 6 7 0 17-8 18-7 1-10 5-11 10-2-6-3-9-7-12Z"/><circle cx="14" cy="17" r="4"/><circle cx="25" cy="12" r="4"/><path d="M44 49c11-3 14-13 13-24-12 1-21 7-22 18m3 5 15-16"/></svg>',
      microscope:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="m27 9 13 8-7 12-13-8 7-12Zm-4 16-5 9m22-13 5 9M17 34c-5 12 3 22 16 22h18M28 35c0 8 6 13 14 13h8M12 56h42"/><circle cx="45" cy="35" r="6"/></svg>',
      dna:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8c0 16 28 32 28 48M46 8c0 16-28 32-28 48M22 16h20M20 27h24M20 38h24M22 49h20"/></svg>',
      classification:'<svg viewBox="0 0 180 150" aria-hidden="true"><path d="M90 29v27M33 93V68h114v25M33 68V55h114v13" class="tree"/><circle cx="90" cy="20" r="13" class="root"/><circle cx="29" cy="109" r="22" class="animal"/><circle cx="70" cy="109" r="22" class="plant"/><circle cx="111" cy="109" r="22" class="fungus"/><circle cx="152" cy="109" r="22" class="microbe"/><path d="M20 110c5-12 14-12 19 0-5 10-14 10-19 0Zm9-4v12" class="symbol"/><path d="M61 119c0-16 4-25 9-29 6 7 9 16 9 29m-17-13h16" class="symbol"/><path d="M99 107c3-14 21-14 24 0H99Zm8 0v13h8v-13" class="symbol"/><circle cx="152" cy="109" r="9" class="symbol"/><path d="m152 95 2 5m11 0-5 4m6 11-6-2m-8 11 1-6m-13-2 6-3m-7-12 6 4" class="symbol"/></svg>'
    };return icons[type]||icons.taxonomy
  }
  const stages=[
    {name:'بوابة علماء التصنيف',sub:'ابدأ بالمفاهيم ورتّب سلّم التصنيف',icon:`<span class="cp-stage-icon taxonomy">${iconSvg('taxonomy')}</span>`,level:'تمهيد'},
    {name:'بعثة الحيوانات والنباتات',sub:'قارن الخلايا وصنّف الحيوانات والنباتات',icon:`<span class="cp-stage-icon life">${iconSvg('life')}</span>`,level:'متوسط'},
    {name:'الفطريات والعالم الدقيق',sub:'طابق الفطريات واكشف أسرار المخلوقات الدقيقة',icon:`<span class="cp-stage-icon microscope">${iconSvg('microscope')}</span>`,level:'متقدم'},
    {name:'بوابة التحدي الكبير',sub:'الطلائعيات والفيروسات وتحدي الخبير',icon:`<span class="cp-stage-icon dna">${iconSvg('dna')}</span>`,level:'خبير'}
  ];
  const tasksPerStage=[3,4,3,3],TOTAL=13;
  let stage=0,task=0,score=0,stars=0,answered=false,taskResults={},taskReviews={},studentName='',classroom='',schoolName='',startedAt=0,submitted=false;
  const choiceOrderHistory={};
  const completedBefore=()=>tasksPerStage.slice(0,stage).reduce((sum,n)=>sum+n,0)+task;
  const setStats=()=>{scoreEl.textContent=score;starsEl.textContent=stars;const p=Math.round((completedBefore()/TOTAL)*100);progressEl.style.width=p+'%';progressEl.parentElement.setAttribute('aria-valuenow',p)};
  const button=(label,fn,secondary=false)=>{const b=document.createElement('button');b.className='cp-btn'+(secondary?' secondary':'');b.textContent=label;b.onclick=fn;return b};
  function welcome(){stage=0;task=0;score=0;stars=0;answered=false;taskResults={};taskReviews={};submitted=false;studentEl.hidden=true;studentEl.textContent='';setStats();main.innerHTML=`<section class="cp-home"><div class="cp-home-hero"><div class="cp-classification-mark" aria-label="مخطط تصنيف المخلوقات الحية">${iconSvg('classification')}</div><span class="cp-home-eyebrow">علوم خامس ابتدائي</span><h1>تصنيف المخلوقات الحية</h1><p class="cp-home-lead">انطلق في أربع مراحل علمية، واكتشف كيف ينظم العلماء تنوع المخلوقات الحية.</p><div class="cp-journey">${stages.map((s,i)=>`<div class="cp-stage-card">${s.icon}<div><strong>${i+1}. ${s.name}</strong><small>${s.level} · ${tasksPerStage[i]} مهام</small></div></div>`).join('')}</div><div class="cp-home-meta"><span>13 مهمة</span><span>10–12 دقيقة</span><span>نتيجة فورية</span></div></div><div class="cp-home-entry"><h2>ابدأ المغامرة</h2><p>أدخل بياناتك ثم ابدأ المرحلة الأولى.</p><div class="cp-form"><label>اسم الطالب<input id="student-name" placeholder="اكتب الاسم الثلاثي" autocomplete="name"></label><label>الفصل<input id="student-class" placeholder="مثال: خامس أ"></label><label>اسم المدرسة<input id="student-school" value="مدرسة جرير الابتدائية بالقطيف" placeholder="اكتب اسم المدرسة" autocomplete="organization"></label><div id="form-error" class="cp-form-error" role="alert"></div></div><div id="welcome-action"></div></div><div id="top-ten" class="cp-leaderboard"><h3>🏅 أعلى 10 نتائج</h3><p class="cp-sub">جاري تحميل النتائج...</p></div><div class="cp-home-footer"><div class="cp-credit"><strong>إعداد الأستاذ علوي العباس</strong><span>مدرسة جرير الابتدائية بالقطيف</span><small>بالاستعانة بالذكاء الاصطناعي</small></div><a class="cp-feedback-link" href="feedback.html">💬 تواصل وشكر وملاحظات</a></div></section>`;const start=button('ابدأ المغامرة',()=>{const n=main.querySelector('#student-name').value.trim(),c=main.querySelector('#student-class').value.trim(),s=main.querySelector('#student-school').value.trim();if(!n||!c||!s){main.querySelector('#form-error').textContent='اكتب اسم الطالب والفصل واسم المدرسة أولًا.';return}studentName=n;classroom=c;schoolName=s;studentEl.innerHTML=`<strong>${safe(n)}</strong><small>${safe(c)} · ${safe(s)}</small>`;studentEl.hidden=false;startedAt=Date.now();gate()});main.querySelector('#welcome-action').append(start);loadLeaderboard()}
  function gate(){answered=false;setStats();const s=stages[stage];main.innerHTML=`<section class="cp-gate"><span>${s.icon}</span><p>المرحلة ${stage+1} من 4 · ${s.level} · ${tasksPerStage[stage]} مهام</p><h1>${s.name}</h1><h2>${s.sub}</h2><div class="cp-level">${stages.map((_,i)=>`<i class="${i<=stage?'on':''}"></i>`).join('')}</div><div id="gate-action"></div></section>`;main.querySelector('#gate-action').append(button('ابدأ المرحلة',()=>render()))}
  function feedback(ok,text,nextLabel='المهمة التالية'){const box=document.createElement('div');box.className='cp-feedback';box.innerHTML=`<strong>${ok?'✓ أحسنت!':'✕ راجع الإجابة'}</strong><span>${text}</span>`;box.append(button(nextLabel,next));return box}
  function grade(ok,review={}){const key=`${stage}-${task}`;if(Object.prototype.hasOwnProperty.call(taskResults,key))return taskResults[key];const fallbacks={'2-1':{prompt:'أي مملكة تستطيع بعض مخلوقاتها العيش في الينابيع شديدة الحرارة؟',correct:'البدائيات',explain:'تستطيع بعض البدائيات العيش في الظروف القاسية.'},'2-2':{prompt:'ما الجزء الذي يجعل عبارة «جميع أنواع البكتيريا ضارة وتسبب الأمراض» غير صحيحة؟',correct:'جميع أنواع',explain:'بعض البكتيريا نافع، لذلك كلمة «جميع» تجعل العبارة خاطئة.'}};if(!review.prompt&&fallbacks[key])review={...fallbacks[key],student:document.activeElement?.textContent?.trim()||'لم تُسجّل'};taskResults[key]=Boolean(ok);taskReviews[key]={...review,ok:Boolean(ok),number:completedBefore()+1};answered=true;score=Object.values(taskResults).filter(Boolean).length;stars=score*12;setStats();return ok}
  function next(){task++;answered=false;if(task>=tasksPerStage[stage]){stage++;task=0;if(stage>=4){result();return}gate();return}render()}
  function choice(title,prompt,options,correct,explain,tag='اختيار مباشر'){main.innerHTML=`<section class="cp-screen cp-card"><span class="cp-tag">${tag}</span><h2>${prompt}</h2><div class="cp-options"></div><div id="cp-feed"></div></section>`;const list=main.querySelector('.cp-options'),correctLabel=options[correct],randomized=randomizedOptions(prompt,options,correct);randomized.forEach(item=>{const b=document.createElement('button');b.innerHTML=`<span>${item.label}</span>`;b.onclick=()=>{if(answered)return;grade(item.isCorrect,{prompt,student:item.label,correct:correctLabel,explain});[...list.children].forEach((x,j)=>{x.disabled=true;if(randomized[j].isCorrect)x.classList.add('good');else if(x===b)x.classList.add('bad')});main.querySelector('#cp-feed').append(feedback(item.isCorrect,explain))};list.append(b)})}
  function shuffled(list){const result=[...list];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}if(result.length>1&&result.every((item,i)=>item===list[i]))result.push(result.shift());return result}
  function randomizedOptions(key,options,correct){const result=shuffled(options.map((label,index)=>({label,isCorrect:index===correct}))),signature=items=>items.map(item=>item.label).join('\u001f');if(result.length>1&&choiceOrderHistory[key]===signature(result))result.push(result.shift());choiceOrderHistory[key]=signature(result);return result}
  function dragActivity(config){const placed={};const displayItems=shuffled(config.items);let selected=null,graded=false;main.innerHTML=`<section class="cp-screen cp-card"><span class="cp-tag">${config.tag}</span><h2>${config.prompt}</h2><div class="cp-board"><div class="cp-board-title"><span>${config.icon}</span><div><strong>${config.title}</strong><small>يمكن تغيير البطاقات بحرية قبل اعتماد الإجابة.</small></div></div><div class="cp-interaction-help"><span>📱</span><strong>على الجوال:</strong><span>اضغط البطاقة أولًا، ثم اضغط الخانة المناسبة.</span><small>على الكمبيوتر يمكنك السحب والإفلات.</small></div><div class="cp-workspace ${config.pyramid?'pyramid-workspace':''}"><div class="cp-zones ${config.order?'order':''} ${config.pyramid?'pyramid':''}"></div><div class="cp-tray-wrap"><strong>البطاقات المتاحة</strong><div class="cp-tray"></div></div></div><div id="drag-error"></div><div class="cp-actions"><button class="cp-btn" id="verify" disabled>اعتمد الإجابة</button></div></div><div id="cp-feed"></div></section>`;
    const zones=main.querySelector('.cp-zones'),tray=main.querySelector('.cp-tray'),verify=main.querySelector('#verify'),error=main.querySelector('#drag-error');
    config.targets.forEach((t,i)=>{const z=document.createElement('div');z.className='cp-zone'+(t.fixed?' fixed':'');z.dataset.target=t.id;if(config.pyramid)z.style.width=`${100-i*9}%`;z.innerHTML=t.fixed?`<strong>${t.label}</strong>`:`<strong>${t.label||'ضع البطاقة هنا'}</strong><div class="cp-zone-items"></div>`;if(!t.fixed){z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();place(e.dataTransfer.getData('text/plain'),t.id)};z.onclick=()=>{if(selected)place(selected,t.id)}}zones.append(z)});
    tray.ondragover=e=>{if(!graded)e.preventDefault()};tray.ondrop=e=>{if(graded)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');delete placed[id];selected=null;paint()};tray.onclick=()=>{if(!graded&&selected){delete placed[selected];selected=null;paint()}};
    function piece(item){const b=document.createElement('button');b.className='cp-piece';b.draggable=!graded;b.dataset.id=item.id;b.innerHTML=`<span>⋮⋮</span>${item.image?`<span class="cp-photo ${item.image}"></span>`:item.icon?`<em>${item.icon}</em>`:''}<strong>${item.label}</strong>`;b.ondragstart=e=>{if(!graded)e.dataTransfer.setData('text/plain',item.id)};b.onclick=e=>{e.stopPropagation();if(graded)return;selected=item.id;paint()};return b}
    function place(id,target){if(graded||!id)return;placed[id]=target;selected=null;error.innerHTML='';paint()}
    function paint(){tray.innerHTML='';main.querySelectorAll('.cp-zone-items').forEach(z=>z.innerHTML='');displayItems.forEach(item=>{const b=piece(item);if(selected===item.id)b.classList.add('selected');if(graded&&placed[item.id])b.classList.add(placed[item.id]===item.target?'right':'wrong');if(placed[item.id])main.querySelector(`[data-target="${placed[item.id]}"] .cp-zone-items`).append(b);else tray.append(b)});verify.disabled=graded||Object.keys(placed).length!==config.items.length}
    verify.onclick=()=>{if(graded)return;const visibleCount=main.querySelectorAll('.cp-zone .cp-piece').length;const ok=visibleCount===config.items.length&&config.targets.every(target=>[...main.querySelectorAll(`[data-target="${target.id}"] .cp-piece`)].every(card=>config.items.find(item=>item.id===card.dataset.id)?.target===target.id));const targetLabel=id=>config.targets.find(t=>t.id===id)?.label||'خانة غير محددة';const student=config.items.map(item=>`${item.label} ← ${targetLabel(placed[item.id])}`).join('، ');const correct=config.items.map(item=>`${item.label} ← ${targetLabel(item.target)}`).join('، ');graded=true;grade(ok,{prompt:config.prompt,student,correct,explain:config.explain});verify.closest('.cp-board').classList.add('locked');main.querySelector('#cp-feed').append(feedback(ok,ok?config.explain:'ظهرت مواضع الخطأ باللون الأحمر.',config.last?'اعرض النتيجة':'المهمة التالية'));error.innerHTML='';paint()};paint()
  }
  function pyramidActivity(){
    const rows=[
      {id:'kingdom',label:'المملكة',fixed:true},
      {id:'phylum',label:'الشعبة',fixed:true},
      {id:'class',label:'',fixed:false},
      {id:'order',label:'الرتبة',fixed:true},
      {id:'family',label:'',fixed:false},
      {id:'genus',label:'الجنس',fixed:true},
      {id:'species',label:'',fixed:false}
    ];
    const items=[{id:'class-card',label:'الطائفة',target:'class'},{id:'family-card',label:'الفصيلة',target:'family'},{id:'species-card',label:'النوع',target:'species'}],displayItems=shuffled(items);
    const placed={};let selected=null,graded=false;
    main.innerHTML=`<section class="cp-screen cp-card"><span class="cp-tag">أكمل المخطط</span><h2>أكمل هرم التصنيف من المملكة إلى النوع بوضع المستويات الناقصة.</h2><div class="cp-board"><div class="cp-board-title"><span>🏛️</span><div><strong>هرم مستويات التصنيف</strong><small>الخانات ثابتة، ويمكن تغيير البطاقات بحرية قبل اعتماد الإجابة.</small></div></div><div class="cp-interaction-help"><span>📱</span><strong>على الجوال:</strong><span>اضغط البطاقة أولًا، ثم اضغط الخانة المناسبة.</span><small>على الكمبيوتر يمكنك السحب والإفلات.</small></div><div class="cp-workspace pyramid-workspace"><div class="cp-pyramid"></div><div class="cp-tray-wrap"><strong>البطاقات المتاحة</strong><div class="cp-tray"></div></div></div><div id="drag-error"></div><div class="cp-actions"><button class="cp-btn" id="verify" disabled>اعتمد الإجابة</button></div></div><div id="cp-feed"></div></section>`;
    const pyramid=main.querySelector('.cp-pyramid'),tray=main.querySelector('.cp-tray'),verify=main.querySelector('#verify'),error=main.querySelector('#drag-error');
    rows.forEach(row=>{const zone=document.createElement('div');zone.className='cp-pyramid-row'+(row.fixed?'':' missing');zone.dataset.target=row.id;zone.innerHTML=row.fixed?`<strong>${row.label}</strong>`:'<span>ضع المستوى الناقص هنا</span>';if(!row.fixed){zone.ondragover=e=>e.preventDefault();zone.ondrop=e=>{e.preventDefault();place(e.dataTransfer.getData('text/plain'),row.id)};zone.onclick=()=>{if(selected)place(selected,row.id)}}pyramid.append(zone)});
    tray.ondragover=e=>{if(!graded)e.preventDefault()};tray.ondrop=e=>{if(graded)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');delete placed[id];selected=null;paint()};tray.onclick=()=>{if(!graded&&selected){delete placed[selected];selected=null;paint()}};
    function card(item){const b=document.createElement('button');b.className='cp-piece';b.draggable=!graded;b.dataset.id=item.id;b.innerHTML=`<span>⋮⋮</span><strong>${item.label}</strong>`;b.ondragstart=e=>{if(!graded)e.dataTransfer.setData('text/plain',item.id)};b.onclick=e=>{e.stopPropagation();if(graded)return;selected=item.id;paint()};return b}
    function place(id,target){if(graded||!id)return;placed[id]=target;selected=null;error.innerHTML='';paint()}
    function paint(){rows.filter(r=>!r.fixed).forEach(row=>{pyramid.querySelector(`[data-target="${row.id}"]`).innerHTML=''});tray.innerHTML='';displayItems.forEach(item=>{const b=card(item);if(selected===item.id)b.classList.add('selected');if(graded&&placed[item.id])b.classList.add(placed[item.id]===item.target?'right':'wrong');if(placed[item.id])pyramid.querySelector(`[data-target="${placed[item.id]}"]`).append(b);else tray.append(b)});rows.filter(r=>!r.fixed).forEach(row=>{const zone=pyramid.querySelector(`[data-target="${row.id}"]`);if(!zone.children.length)zone.innerHTML='<span>ضع المستوى الناقص هنا</span>'});verify.disabled=graded||Object.keys(placed).length!==items.length}
    verify.onclick=()=>{if(graded)return;const expected={class:'الطائفة',family:'الفصيلة',species:'النوع'};const ok=Object.entries(expected).every(([target,label])=>pyramid.querySelector(`[data-target="${target}"] .cp-piece strong`)?.textContent.trim()===label);const rowName={class:'الخانة الثالثة',family:'الخانة الخامسة',species:'الخانة السابعة'};const student=Object.keys(expected).map(target=>`${rowName[target]}: ${pyramid.querySelector(`[data-target="${target}"] .cp-piece strong`)?.textContent.trim()||'فارغة'}`).join('، ');graded=true;grade(ok,{prompt:'أكمل هرم التصنيف من المملكة إلى النوع.',student,correct:'الطائفة في الثالثة، الفصيلة في الخامسة، النوع في السابعة',explain:'الترتيب الكامل: المملكة، الشعبة، الطائفة، الرتبة، الفصيلة، الجنس، النوع.'});verify.closest('.cp-board').classList.add('locked');main.querySelector('#cp-feed').append(feedback(ok,ok?'اكتمل الهرم: المملكة، الشعبة، الطائفة، الرتبة، الفصيلة، الجنس، النوع.':'ظهرت مواضع الخطأ باللون الأحمر.'));error.innerHTML='';paint()};paint()
  }
  function reveal(){let open=0;const prompt='أي مملكة تستطيع بعض مخلوقاتها العيش في الينابيع شديدة الحرارة؟';main.innerHTML=`<section class="cp-screen cp-card"><span class="cp-tag">من أنا؟</span><h2>${prompt}</h2><div class="cp-reveal" role="img" aria-label="ينبوع حار محاط بالصخور والبخار"><svg viewBox="0 0 300 300" aria-hidden="true"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd7e8"/><stop offset="1" stop-color="#dff3db"/></linearGradient><radialGradient id="water"><stop offset="0" stop-color="#ffe36e"/><stop offset=".48" stop-color="#f49a49"/><stop offset="1" stop-color="#3ca9b7"/></radialGradient></defs><rect width="300" height="300" fill="url(#sky)"/><circle cx="245" cy="52" r="25" fill="#ffd45a"/><path d="M0 180 Q55 125 105 178 T210 170 T300 165 V300 H0Z" fill="#6d8553"/><ellipse cx="150" cy="215" rx="105" ry="55" fill="#735b45"/><ellipse cx="150" cy="205" rx="85" ry="42" fill="url(#water)"/><g fill="#8a765d"><circle cx="60" cy="210" r="18"/><circle cx="88" cy="244" r="15"/><circle cx="220" cy="239" r="19"/><circle cx="242" cy="203" r="14"/></g><g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".8"><path d="M110 162 Q94 132 112 104"/><path d="M155 155 Q173 126 153 93"/><path d="M198 164 Q214 134 199 112"/></g><g fill="#7d2c72" opacity=".9"><circle cx="128" cy="205" r="5"/><circle cx="153" cy="223" r="4"/><circle cx="182" cy="201" r="5"/><circle cx="169" cy="187" r="3"/></g></svg><div class="cp-cover">${[0,1,2,3].map(()=>'<button aria-label="اكشف هذا الجزء">؟</button>').join('')}</div></div><p class="cp-reveal-help">اضغط أي مربع، أو استخدم زر الكشف.</p><button class="cp-btn secondary" id="reveal">اكشف جزءًا من الصورة</button><div class="cp-options" id="reveal-options"></div><div id="cp-feed"></div></section>`;const covers=[...main.querySelectorAll('.cp-cover button')],revealButton=main.querySelector('#reveal');const openTile=i=>{if(i<0||i>=covers.length||covers[i].classList.contains('open'))return;covers[i].classList.add('open');open++;if(open===4){revealButton.disabled=true;revealButton.textContent='اكتملت الصورة'}};covers.forEach((cover,i)=>cover.onclick=()=>openTile(i));revealButton.onclick=()=>openTile(covers.findIndex(c=>!c.classList.contains('open')));const list=main.querySelector('#reveal-options'),choices=randomizedOptions(prompt,['الفطريات','البدائيات','الحيوانات'],1);choices.forEach(item=>{const b=document.createElement('button');b.textContent=item.label;b.onclick=()=>{if(answered)return;grade(item.isCorrect);[...list.children].forEach((choice,j)=>{choice.disabled=true;if(choices[j].isCorrect)choice.classList.add('good');else if(choice===b)choice.classList.add('bad')});main.querySelector('#cp-feed').append(feedback(item.isCorrect,'تستطيع بعض البدائيات العيش في الظروف القاسية.'))};list.append(b)})}
  function wordHunt(){main.innerHTML=`<section class="cp-screen cp-card"><span class="cp-tag">اكتشف الخطأ</span><h2>اضغط الجزء الذي يجعل العبارة غير صحيحة:</h2><p class="cp-sub">جميع أنواع البكتيريا ضارة وتسبب الأمراض.</p><div class="cp-words"></div><div id="cp-feed"></div></section>`;const words=['جميع أنواع','البكتيريا','ضارة','وتسبب الأمراض'];const wrap=main.querySelector('.cp-words');words.forEach(word=>{const b=document.createElement('button');b.textContent=word;b.onclick=()=>{if(answered)return;const ok=word==='جميع أنواع';grade(ok);[...wrap.children].forEach(choice=>{choice.disabled=true;if(choice.textContent==='جميع أنواع')choice.classList.add('good');else if(choice===b)choice.classList.add('bad')});main.querySelector('#cp-feed').append(feedback(ok,'بعض البكتيريا نافع، لذلك كلمة «جميع» تجعل العبارة خاطئة.'))};wrap.append(b)})}
  const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  function readLocalResults(){try{return JSON.parse(localStorage.getItem('classification-results-v1')||'[]')}catch{return []}}
  async function getResults(){let rows=[];try{const response=await fetch(API_URL,{cache:'no-store'});const data=await response.json();if(data.ok&&Array.isArray(data.results))rows=data.results}catch{}return rows.length?rows:readLocalResults()}
  async function loadLeaderboard(){const box=main.querySelector('#top-ten');if(!box)return;const rows=await getResults();if(!main.contains(box))return;const best=new Map();rows.forEach(row=>{const key=`${String(row.name||'').trim()}|${String(row.classroom||'').trim()}|${String(row.school||'').trim()}`;if(!key||key==='||')return;const old=best.get(key);if(!old||Number(row.percent)>Number(old.percent)||(Number(row.percent)===Number(old.percent)&&Number(row.duration_sec)<Number(old.duration_sec)))best.set(key,row)});const top=[...best.values()].sort((a,b)=>Number(b.percent)-Number(a.percent)||Number(a.duration_sec)-Number(b.duration_sec)).slice(0,10);box.innerHTML=`<h3>🏅 أعلى 10 نتائج</h3>${top.length?`<ol>${top.map(row=>`<li><span><strong>${safe(row.name)}</strong><small>${safe(row.classroom)} · ${safe(row.school||'المدرسة غير مسجلة')}</small></span><strong>${Number(row.percent)||0}%</strong></li>`).join('')}</ol>`:'<p class="cp-sub">لا توجد نتائج مسجلة حتى الآن.</p>'}`}
  function saveResult(){if(submitted)return;submitted=true;let local=[];try{local=readLocalResults()}catch{}const attempts=local.filter(r=>String(r.name||'').trim()===studentName.trim()&&String(r.classroom||'').trim()===classroom.trim()&&String(r.school||'').trim()===schoolName.trim()).length+1;const row={name:studentName,classroom,school:schoolName,score,total:TOTAL,percent:Math.round(score/TOTAL*100),attempts,duration_sec:Math.max(1,Math.round((Date.now()-startedAt)/1000)),date:new Date().toLocaleString('ar-SA')};try{local.unshift(row);localStorage.setItem('classification-results-v1',JSON.stringify(local.slice(0,200)))}catch{}fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(row)}).catch(()=>{})}
  function reviewMistakes(index=0){const mistakes=Object.values(taskReviews).filter(item=>!item.ok).sort((a,b)=>a.number-b.number);if(!mistakes.length){result();return}const item=mistakes[Math.max(0,Math.min(index,mistakes.length-1))];main.innerHTML=`<section class="cp-screen cp-card"><span class="cp-tag">مراجعة الخطأ ${index+1} من ${mistakes.length}</span><div class="cp-review-card"><h2>السؤال ${item.number}: ${safe(item.prompt)}</h2><div class="cp-answer-box wrong"><strong>إجابتك</strong><p>${safe(item.student||'لم تُسجّل')}</p></div><div class="cp-answer-box correct"><strong>الإجابة الصحيحة</strong><p>${safe(item.correct||'—')}</p></div><div class="cp-answer-box"><strong>التوضيح</strong><p>${safe(item.explain||'')}</p></div></div><div id="review-actions" class="cp-review-nav"></div></section>`;const actions=main.querySelector('#review-actions');if(index>0)actions.append(button('السابق',()=>reviewMistakes(index-1),true));if(index<mistakes.length-1)actions.append(button('التالي',()=>reviewMistakes(index+1)));actions.append(button('العودة للنتيجة',result,true))}
  function result(){score=Object.values(taskResults).filter(Boolean).length;stars=score*12;setStats();progressEl.style.width='100%';const percent=Math.round(score/TOTAL*100),mistakes=Object.values(taskReviews).filter(item=>!item.ok).length;main.innerHTML=`<section class="cp-gate"><span>🏆</span><p>اكتملت المغامرة يا ${safe(studentName)}</p><div class="cp-score-final">${score} من ${TOTAL}</div><h1>${percent>=90?'ممتاز! خبير في التصنيف':percent>=70?'جيد جدًا! واصل التقدم':'محاولة جيدة، راجع ثم حاول مجددًا'}</h1><div class="cp-review">${Array.from({length:TOTAL},(_,i)=>`<i class="${taskResults[`${Math.floor(i<3?0:i<7?1:i<10?2:3)}-${i<3?i:i<7?i-3:i<10?i-7:i-10}`]?'ok':'no'}">${i+1}</i>`).join('')}</div><div class="cp-badges">${stages.map(s=>`<span>${s.icon}<small>شارة مرحلة</small></span>`).join('')}</div><h2>⭐ ${stars} نجمة · ${percent}%</h2><p class="cp-save">تم حفظ النتيجة على الجهاز وإرسالها إلى لوحة المعلم عند توفر الإنترنت.</p><div id="result-actions" class="cp-review-nav"></div></section>`;const actions=main.querySelector('#result-actions');if(mistakes)actions.append(button(`مراجعة الأخطاء (${mistakes})`,()=>reviewMistakes(0)));actions.append(button('إعادة المحاولة',()=>{stage=0;task=0;score=0;stars=0;answered=false;taskResults={};taskReviews={};submitted=false;startedAt=Date.now();gate()}));actions.append(button('العودة للبداية',welcome,true));saveResult()}
  function render(){setStats();
    if(stage===0&&task===0)choice('','ما المقصود بالتصنيف؟',['تقسيم المخلوقات الحية إلى مجموعات بحسب تشابهها','ترتيب المخلوقات بحسب حجمها فقط','إعطاء كل مخلوق اسمًا مختلفًا'],0,'يعتمد التصنيف على التشابه في الشكل أو التركيب أو الوظائف.');
    else if(stage===0&&task===1)pyramidActivity();
    else if(stage===0&&task===2)choice('','كلما اتجهنا من المملكة نحو النوع...',['يقل عدد المخلوقات ويزداد التشابه بينها','يزداد عدد المخلوقات ويقل التشابه بينها','يزداد العدد والتشابه معًا'],0,'النوع أدق مستويات التصنيف ويضم مخلوقات متقاربة جدًا في الصفات.');
    else if(stage===1&&task===0)choice('','ما الوصف الصحيح لتركيب الخلية الحيوانية؟',['يحيط بها جدار خلوي','يخلو تركيبها من الجدار الخلوي','تصنع غذاءها بنفسها'],1,'الخلايا الحيوانية لا يحيط بها جدار خلوي.');
    else if(stage===1&&task===1)dragActivity({tag:'تصنيف سريع',prompt:'وزّع الحيوانات على مجموعتي الفقاريات واللافقاريات.',icon:'🌍',title:'تصنيف الحيوانات',targets:[{id:'v',label:'الفقاريات'},{id:'iv',label:'اللافقاريات'}],items:[{id:'h',label:'الحصان',image:'animal-horse',target:'v'},{id:'f',label:'السمكة',image:'animal-fish',target:'v'},{id:'d',label:'اليعسوب',image:'animal-dragonfly',target:'iv'},{id:'j',label:'قنديل البحر',image:'animal-jellyfish',target:'iv'}],explain:'الفقاريات لها عمود فقري، واللافقاريات ليس لها عمود فقري.'});
    else if(stage===1&&task===2)choice('','أي تركيب يوجد في خلايا النباتات والفطريات معًا؟',['الجدار الخلوي','أعضاء الحس','العمود الفقري'],0,'يحيط بخلايا كل من النباتات والفطريات جدار خلوي.');
    else if(stage===1&&task===3)dragActivity({tag:'حديقة التصنيف',prompt:'صنّف النباتات إلى وعائية ولاوعائية.',icon:'🌿',title:'حديقة النباتات',targets:[{id:'vascular',label:'نباتات وعائية'},{id:'nonvascular',label:'نباتات لاوعائية'}],items:[{id:'tree',label:'الشجرة',image:'plant-tree',target:'vascular'},{id:'flower',label:'الأقحوان',image:'plant-chamomile',target:'vascular'},{id:'moss',label:'الحزاز',image:'plant-moss',target:'nonvascular'},{id:'liver',label:'حشيشة الكبد',image:'plant-liverwort',target:'nonvascular'}],explain:'النباتات الوعائية لها أوعية تنقل الماء والغذاء، أما اللاوعائية فلا تمتلكها.'});
    else if(stage===2&&task===0)dragActivity({tag:'مطابقة',prompt:'ضع كل فطر في الخانة التي تصف فائدته أو أثره.',icon:'🍄',title:'رف عينات الفطريات',targets:[{id:'bread',label:'يستخدم في صناعة الخبز'},{id:'mold',label:'ينمو على الغذاء'},{id:'disease',label:'يصيب نبات الذرة'},{id:'edible',label:'فطر نافع صالح للأكل'}],items:[{id:'yeast',label:'الخميرة',image:'fungi-yeast',target:'bread'},{id:'bread-mold',label:'عفن الخبز',image:'fungi-mold',target:'mold'},{id:'smut',label:'تفحم الذرة',image:'fungi-smut',target:'disease'},{id:'truffle',label:'الكمأة',image:'fungi-truffle',target:'edible'}],explain:'تختلف الفطريات؛ فمنها النافع ومنها ما يسبب التعفن أو أمراض النباتات.'});
    else if(stage===2&&task===1)reveal();
    else if(stage===2&&task===2)wordHunt();
    else if(stage===3&&task===0)choice('','أي وصف ينطبق على مملكة الطلائعيات؟',['جميعها عديدة الخلايا','منها وحيدة الخلية ومنها عديدة الخلايا','جميعها لا تصنع غذاءها'],1,'من الطلائعيات ما هو وحيد الخلية ومنها ما هو عديد الخلايا.');
    else if(stage===3&&task===1)dragActivity({tag:'مختبر التصنيف',prompt:'صنّف العينات المجهرية وحدد الصورة التي لا تنتمي إلى الطلائعيات.',icon:'🔬',title:'صواني المختبر',targets:[{id:'animal-like',label:'أشباه الحيوانات'},{id:'plant-like',label:'أشباه النباتات'},{id:'fungus-like',label:'أشباه الفطريات'},{id:'not-protist',label:'لا تنتمي إلى الطلائعيات'}],items:[{id:'pa',label:'البراميسيوم',image:'microbe-paramecium',target:'animal-like'},{id:'al',label:'الطحالب الحمراء',image:'microbe-algae',target:'plant-like'},{id:'sl',label:'العفن الغروي',image:'microbe-slime',target:'fungus-like'},{id:'ba',label:'البكتيريا',image:'microbe-bacteria',target:'not-protist'}],explain:'تضم الطلائعيات أشباه الحيوانات وأشباه النباتات وأشباه الفطريات، أما البكتيريا فلها مملكة مستقلة.'});
    else choice('','لماذا لا تُصنف الفيروسات ضمن الممالك الست؟',['لأنها صغيرة جدًا فقط','لأنها لا تقوم بوظائف الحياة ولا تتكاثر إلا داخل خلية حية','لأنها تعيش في الماء فقط'],1,'الفيروس يحتاج إلى خلية حية للتكاثر ولا يقوم منفردًا بوظائف الحياة.','🏆 التحدي النهائي')}
  welcome();
})();
